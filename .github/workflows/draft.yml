name: Store import-only test APK as draft
on:
  push:
    branches: [test/bundled-hd-final-20261017]
    paths: [payload/**, upload.py, .github/workflows/draft.yml]
permissions:
  contents: write
jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 upload.py
        env:
          GH_TOKEN: ${{ github.token }}
