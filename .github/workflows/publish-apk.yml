name: Publish verified APK
on:
  push:
    branches: [main]
    paths: ['releases/*.json', '.github/workflows/publish-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify release
        run: |
          python3 - <<'PY'
          import json,pathlib,urllib.request,hashlib,os
          files=list(pathlib.Path('releases').glob('v*.json'))
          path=max(files,key=lambda p:tuple(map(int,p.stem[1:].split('.'))))
          d=json.loads(path.read_text())
          name=d['file']
          assert pathlib.Path(name).name==name and name.endswith('.apk')
          assert d['url'].startswith('https://')
          urllib.request.urlretrieve(d['url'],name)
          assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()==d['sha256'],'APK checksum mismatch'
          pathlib.Path('release-notes.txt').write_text(d['notes']+'\n\nSHA-256: `'+d['sha256']+'`\n')
          pathlib.Path('SHA256SUMS.txt').write_text(d['sha256']+'  '+name+'\n')
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write('TAG='+d['tag']+'\nAPK='+name+'\n')
          PY
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Unofficial PokeFields Android $TAG" --notes-file release-notes.txt --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" "$APK" SHA256SUMS.txt --clobber
          gh release edit "$TAG" --draft=false --latest
